<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СМИТАП – преподаватели (версия 5)</title>
<style>
/* шрифт – только из брендбука: Visuelt Pro Regular / Medium */
@font-face{font-family:"Visuelt";src:url("../assets/fonts/visuelt-regular.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Visuelt";src:url("../assets/fonts/visuelt-medium.woff") format("woff");font-weight:500;font-display:swap}
:root{--teal:#B0F2EB;--white:#FFFFFF;--graphite:#3A3A3A;--orange:#FFAA44;--ease:cubic-bezier(.22,1,.36,1);
  --left:42vw;--strip:2.6vw;--cardW:min(23vw,380px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{font-family:"Visuelt",Arial,sans-serif;color:var(--graphite);background:var(--teal);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}

/* ───── шапка – полупрозрачная скругленная плашка, как в v2 ───── */
.hdr{position:fixed;inset:0 0 auto;z-index:50}
.hdr .in{display:flex;align-items:center;gap:28px;height:72px;margin:14px clamp(14px,2vw,28px) 0;padding:0 12px 0 26px;border-radius:22px;background:rgba(255,255,255,.55);border:1.5px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);box-shadow:0 22px 50px -30px rgba(25,105,105,.4)}
.logo{width:136px;flex:none}.logo img{display:block;width:100%;height:auto}
.nav{display:flex;gap:4px;font-size:16px;font-weight:500;list-style:none}
.nav a{display:flex;align-items:center;height:44px;padding:0 16px;border-radius:999px;transition:background-color .2s}
.nav a:hover{background:var(--white)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.ib{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:16px;background:var(--white)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 6px 0 24px;border-radius:999px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform .2s var(--ease)}
.pill:hover{transform:translateY(-2px)}
.pill.dark{background:var(--graphite);color:var(--white)}
.pill.light{background:var(--white);padding:0 24px}
.pill .go{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:14px;background:var(--orange);color:var(--graphite)}
.pill .go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr .pill{height:48px;font-size:16px}
.hdr .pill .go{width:36px;height:36px;border-radius:12px}

/* ───── 6 блок – преподаватели: секция залипает, справа по скроллу выезжают панели предметов ───── */
.tch{position:relative}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--teal)}
.lead{position:absolute;left:0;top:0;bottom:0;width:var(--left);padding:calc(110px + 6vh) 3.4vw 5vh;display:flex;flex-direction:column;z-index:1}
.ttl{font-weight:500;text-transform:uppercase;line-height:.88;letter-spacing:-.04em;font-size:var(--ttlF,64px)}
.ttl span{display:block}
.ttl .pl{display:inline-block;margin-top:.12em;padding:.06em .18em .1em;background:var(--orange);transform:rotate(-3deg);transform-origin:left center}
.seg{display:inline-flex;gap:4px;padding:4px;margin-top:clamp(22px,4vh,40px);border-radius:18px;background:rgba(255,255,255,.6);align-self:flex-start}
.seg button{height:42px;padding:0 18px;border:0;border-radius:14px;background:none;font-weight:500;font-size:16px;transition:background-color .2s}
.seg button.on{background:var(--graphite);color:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;max-width:calc(var(--left) - var(--cardW) / 2 - 6vw)}   /* не заходит под фото-карточку */
.chips button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border:0;border-radius:999px;background:rgba(255,255,255,.6);font-size:14px;transition:background-color .2s,transform .25s var(--ease)}
.chips button i{width:14px;height:14px;border-radius:5px;flex:none}
.chips button.on{background:var(--white);transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(25,105,105,.45)}
.cnt{margin-top:auto;font-weight:500;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:14px}
.cnt .bar{width:120px;height:4px;border-radius:2px;background:rgba(58,58,58,.15);overflow:hidden}
.cnt .bar i{display:block;height:100%;background:var(--graphite);transform-origin:left;transform:scaleX(var(--pr,0))}
.cnt small{font-weight:400;opacity:.6}

.pn{position:absolute;top:0;bottom:0;left:var(--left);width:calc(100vw - var(--left));will-change:transform;box-shadow:-24px 0 48px -30px rgba(58,58,58,.35)}
.card{position:absolute;left:calc(var(--cardW) / -2);top:50%;width:var(--cardW);aspect-ratio:3/4;margin-top:calc(var(--cardW) * -2 / 3 + 30px);border-radius:28px;overflow:hidden;background:var(--white);box-shadow:0 40px 70px -34px rgba(40,40,40,.55);will-change:transform,opacity}
.card img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.card .stub{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500;opacity:.9}
.card .stub img{width:64%;height:auto;object-fit:contain}
.card .tag{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:12px;background:var(--white);font-size:13px;font-weight:500}
.body{position:absolute;inset:0;padding:calc(112px + 3vh) calc(var(--strip) * 3 + 3vw) 5vh calc(var(--cardW) / 2 + 3.4vw);display:flex;flex-direction:column}
.sub{font-weight:500;text-transform:uppercase;letter-spacing:-.035em;line-height:.9;font-size:clamp(40px,4.4vw,76px);white-space:nowrap}
.nm{margin-top:14px;font-weight:500;font-size:clamp(22px,1.7vw,30px);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.nm small{font-weight:400;font-size:14px;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.65)}
.q{margin-top:14px;font-size:clamp(15px,1.12vw,18px);line-height:1.45;max-width:36em}
.facts{list-style:none;margin-top:18px;display:grid;gap:8px;font-size:clamp(14px,.98vw,16px);line-height:1.35}
.facts li{position:relative;padding-left:22px}
.facts li::before{content:"";position:absolute;left:0;top:.42em;width:10px;height:10px;border-radius:3px;background:var(--acc)}
.btns{margin-top:auto;padding-top:20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.soc{display:flex;gap:8px;margin-left:6px}
.soc a{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.7)}
.soc svg{width:20px;height:20px;fill:currentColor}

.after{min-height:60vh;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:20px;opacity:.55}

/* мобильный – пока просто стопкой (десктоп сначала) */
@media (max-width:820px){
  :root{--left:100vw}
  .hdr .nav,.hdr .ib{display:none}
  .pin{position:relative;height:auto;overflow:visible}
  .lead{position:relative;width:100%;padding:120px 20px 24px}
  .chips{max-width:none}.cnt{display:none}
  .pns{position:relative}
  .pn{position:relative;left:auto;width:100%;transform:none!important;box-shadow:none}
  .card{position:relative;left:auto;top:auto;margin:24px auto 0;width:min(78vw,360px);transform:none!important;opacity:1!important}
  .body{position:relative;padding:20px 20px 40px}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</svg>

<header class="hdr">
  <div class="in">

<section class="tch" id="tch" aria-label="Преподаватели">
  <div class="pin">
    <div class="lead">
      <h2 class="ttl" id="ttl"><span>Преподаватели,</span><span>которые влюбят</span><b class="pl">в&nbsp;учебу</b></h2>

      <div class="cnt"><span id="num">01 / 11</span><span class="bar"><i id="bar"></i></span><small>листай, чтобы познакомиться</small></div>
    </div>
    <div class="pns" id="pns"></div>
  </div>
</section>
<section class="after">дальше – 7 блок «Репетитор vs СМИТАП»</section>

<script>
(() => {

    f:['6-й год в онлайн-образовании','Сдала ОГЭ на 5, ЕГЭ по русскому языку – на 94','Окончила с отличием филологический факультет Государственного института русского языка имени А. С. Пушкина','Магистрант МГПУ – специализация в создании онлайн-курсов и дополнительном образовании'] },

    f:['8-й год в онлайн-образовании','Сдала ОГЭ на 5, ЕГЭ по трем предметам – каждый на 95+: английский язык, русский язык, литература','Окончила с красным дипломом филологический факультет СПбГУ','Имеет сертификат о знании языка, подтвержденный Cambridge'] },

    f:['9-й год готовит к ЕГЭ','Каждый год сдает ЕГЭ по обществознанию на 90+','Окончила ОмГУ им. Достоевского по специальности «Социология» с красным дипломом','Подготовка экспертов ЕГЭ, переподготовка на учителя по обществознанию','Рецензент единых учебников по обществознанию','Каждый второй выпускник сдал ЕГЭ по обществознанию на 80+'] },

  artem: { s:'phys', sub:'Физика', n:'Артем Вольт', ex:'ЕГЭ', ph:'artem.png',
    q:'Мой подход к изучению физики – это не зубрежка: лучше прямо на вебинаре я разберу духовку, чтобы увидеть, что у нее внутри!',
    f:['Получил 100 баллов на ЕГЭ','10-й год готовит к ЕГЭ','Окончил физфак ИГУ с красным дипломом','Магистр педагогических наук','Дополнительное образование по программе «Медицинская физика»','Каждый 5-й наш выпускник сдал ЕГЭ по физике на 80+ баллов'] },
  misha: { s:'bio', sub:'Биология', n:'Миша Гис', ex:'ЕГЭ', ph:'misha.jpg',
    q:'На наших курсах мы не только обучаем, но и влюбляем в биологию, чтобы каждый почувствовал огонек внутри себя!',
    f:['Получил 96 баллов на ЕГЭ','10-й год готовит к ЕГЭ – один из первых преподавателей биологии в онлайн-подготовке','Поступил на бюджет биофака СПбГУ','Более 6000 выпускников прошли курсы под его началом','Наши выпускники сдают ЕГЭ по биологии на 80+ баллов в 3 раза чаще, чем все выпускники по России'] },
  lana: { s:'chem', sub:'Химия', n:'Лана Сильвер', ex:'ЕГЭ', ph:'lana.jpg',
    q:'Я влюбилась в химию в тот момент, когда поняла: это наука о превращениях. Все вокруг постоянно меняется – и химия объясняет, почему и как. Давай вместе заглянем за формулы и уравнения!',
    f:['Дважды сдала ЕГЭ по химии на 100 баллов','6-й год в образовании: готовила к ЕГЭ, ОГЭ и ЕНТ','Окончила ИТМО по направлению «Биоинженерия»','Подготовила 30 стобалльников за последние три года','Каждый 3-й наш выпускник сдал ЕГЭ по химии на 80+ баллов'] },
  danya: { s:'inf', sub:'Информатика', n:'Даня Байт', ex:'ЕГЭ', ph:'',
    q:'Кто владеет информацией, тот владеет миром! Научу тебя разбираться во всех тонкостях программирования, чтобы ты стал тем самым крутым айтишником.',
    f:['Получил 94 балла на ЕГЭ','6-й год готовит к ЕГЭ','Окончил КФУ по направлению «Информационная безопасность»','Подготовил более 700 выпускников, которые успешно сдали экзамен и поступили в вузы','Каждый 3-й наш выпускник сдал ЕГЭ по информатике на 80+ баллов!'] },
};
/* сегментация по классам – как в ТЗ; в каждом классе первой идет история */
const GRADES = { 9: ['glinsk','sonya','lyuba','anya'], 10: ['elya'], 11: ['elya','nelya','kirill','olya','lera','vilya','regina','artem','misha','lana','danya'] };   // История – первой (Катя)
let grade = +(Q.get('g') || 11), list = [], P = [], cur = 0;
const STEP = .85;            // сколько высоты экрана прокрутки на одну панель
const MAXS = 3;              // сколько «корешков» следующих предметов видно у правого края
const ICONS = { tg:'<path d="M21.5 3.5 2.8 10.6c-1 .4-1 1.6.1 1.9l4.6 1.4 1.8 5.6c.2.7 1.1.9 1.6.4l2.6-2.4 4.7 3.5c.6.4 1.4.1 1.6-.6l3.4-15.6c.2-.9-.7-1.6-1.7-1.3Zm-4 4.2-8 7.2-.3 3.1-1.3-4.1 9.6-6.2Z"/>',
  yt:'<path d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.6 12 5.6 12 5.6s-6 0-7.9.5A3 3 0 0 0 2 8.2 31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2.1 2.1c1.9.5 7.9.5 7.9.5s6 0 7.9-.5a3 3 0 0 0 2.1-2.1c.3-1.3.4-2.5.4-3.8s-.1-2.5-.4-3.8ZM10 15V9l5.2 3L10 15Z"/>',
  tt:'<path d="M16.6 2h-3.4v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.4 6.4 0 1 0 5.4 6.3V8.6a8 8 0 0 0 4.4 1.4V6.6a4.5 4.5 0 0 1-4.4-4.6Z"/>' };

// контраст по WCAG: темный цвет предмета для названия – только если читается на светлом фоне, иначе графит
const L_ = c => { const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); })
  .reduce((s, v, i) => s + v * [.2126, .7152, .0722][i], 0); };
const contrast = (a, b) => { const x = L_(a), y = L_(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
function build(){
  list = GRADES[grade];
  $('#seg').innerHTML = [9, 10, 11].map(g => `<button role="tab" class="${g === grade ? 'on' : ''}" data-g="${g}">${g} класс</button>`).join('');
  $('#chips').innerHTML = list.map((k, i) => { const t = T[k]; return `<button data-i="${i}"><i style="background:${C[t.s][1]}"></i>${t.sub}</button>`; }).join('');
  $('#pns').innerHTML = list.map((k, i) => { const t = T[k], [lt, dk] = C[t.s], rot = i % 2 ? 3 : -4;
    const photo = t.ph ? `<img src="../assets/photo/${t.ph}" alt="${t.n}">`
      : `<div class="stub" style="background:${lt}"><img src="../assets/mascot/${['point','peace','please','cool'][i % 4]}.svg" alt=""><span>фото скоро</span></div>`;
    return `<article class="pn" style="background:${lt};--acc:${dk};z-index:${10 + i}">
      <div class="card" style="--rot:${rot}deg">${photo}<span class="tag">${t.ex} · ${t.sub.toLowerCase()}</span></div>
      <div class="body">
        <h3 class="sub" style="color:${contrast(dk, lt) >= 3 ? dk : '#3A3A3A'}">${t.sub}</h3>
        <div class="nm">${t.n}<small>${grade} класс · ${t.ex}</small></div>
        <p class="q">${tp(t.q)}</p>
        <ul class="facts">${t.f.map(x => `<li>${tp(x)}</li>`).join('')}</ul>
        <div class="btns"><a class="pill dark" href="#">Выбрать предмет <span class="go"><svg><use href="#i-arrow"/></svg></span></a><a class="pill light" href="#">Попробовать бесплатно</a>
          <span class="soc"><a href="#" aria-label="Телеграм"><svg viewBox="0 0 24 24">${ICONS.tg}</svg></a><a href="#" aria-label="Ютуб"><svg viewBox="0 0 24 24">${ICONS.yt}</svg></a><a href="#" aria-label="Тикток"><svg viewBox="0 0 24 24">${ICONS.tt}</svg></a></span></div>
      </div></article>`; }).join('');
  P = [...document.querySelectorAll('.pn')].map(el => ({ el, card: el.querySelector('.card'), rot: parseFloat(el.querySelector('.card').style.getPropertyValue('--rot')) }));
  $('#tch').style.height = innerWidth > 820 ? `${(list.length - 1) * STEP * 100 + 100}vh` : '';   // залипание: 100vh + прокрутка на все панели
  fitTitle(); frame();
}
// название предмета – одной строкой, длинное («Обществознание») уменьшается до ширины колонки
function fitSubs(){ document.querySelectorAll('.sub').forEach(el => { el.style.fontSize = '';
  const w = el.scrollWidth, cw = el.clientWidth; if (w > cw) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * cw / w) + 'px'; }); }
// заголовок слева – по ширине колонки (капс, Visuelt Medium)
function fitTitle(){
  fitSubs();
  const el = $('#ttl'); el.style.setProperty('--ttlF', '100px');
  const w = Math.max(...[...el.children].map(s => { const r = document.createRange(); r.selectNodeContents(s); return r.getBoundingClientRect().width; }));
  const colW = $('.lead').clientWidth - parseFloat(getComputedStyle($('.lead')).paddingLeft) * 2;
  el.style.setProperty('--ttlF', Math.min(100 * colW / w, innerHeight * .1) + 'px');
}
function progress(){
  if (Q.has('p')) return clamp(+Q.get('p'), 0, list.length - 1);
  const r = $('#tch').getBoundingClientRect();
  return clamp(-r.top / (innerHeight * STEP), 0, list.length - 1);
}
function frame(){
  const W = innerWidth; if (W <= 820) return;
  const p = progress(), left0 = W * .42, S = W * .026, R = W;
  const stripX = t => R - (MAXS - (t - 1)) * S;          // t ≥ 1: позиция «корешка»
  P.forEach((o, i) => {
    const t = i - p; let x;
    if (t <= 0) x = 0;
    else if (t < 1) x = (stripX(1) - left0) * ease(t);
    else if (t <= MAXS + 1) x = Math.min(stripX(t), R) - left0;
    else x = R - left0;
    o.el.style.transform = `translateX(${x}px)`;
    // карточка-фото приезжает вместе со своей панелью; у «корешков» и под следующей карточкой – скрыта
    const vis = t >= 1 ? 0 : t > 0 ? 1 - t : t > -1 ? 1 : 0, ci = clamp(1 - t, 0, 1);
    o.card.style.opacity = t >= 1 ? 0 : t > -1 ? 1 : 0;
    o.card.style.transform = `translateX(${(1 - ease(ci)) * 60}px) rotate(${o.rot * (0.4 + .6 * ease(ci))}deg) scale(${.92 + .08 * ease(ci)})`;
  });
  const now = Math.round(p); if (now !== cur || !$('#chips .on')){ cur = now;
    document.querySelectorAll('#chips button').forEach((b, i) => b.classList.toggle('on', i === cur)); }
  $('#num').textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0');
  $('#bar').style.setProperty('--pr', list.length > 1 ? p / (list.length - 1) : 1);
}
$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; grade = +b.dataset.g; build();
  scrollTo({ top: $('#tch').offsetTop, behavior: SHOT ? 'auto' : 'smooth' }); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  scrollTo({ top: $('#tch').offsetTop + +b.dataset.i * innerHeight * STEP + 2, behavior: 'smooth' }); });
addEventListener('scroll', () => requestAnimationFrame(frame), { passive: true });
addEventListener('resize', () => { fitTitle(); frame(); });
if (document.fonts) document.fonts.ready.then(() => { fitTitle(); frame(); });
build();
})();
</script>
